    init();

    async function init() {
        const files = await (await fetch('files.json')).json();
        const tags = await (await fetch('tags.json')).json();

        for (const key in files) {
            const category = files[key];

            const header = document.createElement('h2');
            header.textContent = key;
            header.setAttribute('data-category', key);
            fragment.appendChild(header);

            for (let i = 0; i < category.length; i++) {
                const file = category[i];
                const link = createLink(file, key, tags[file]);
                fragment.appendChild(link);
                links[file] = link;
                validRedirects.set(file, file + '.html');
                totalCount++;
            }
        }

        content.appendChild(fragment);
        statsEl.textContent = totalCount + ' examples';

        // Restore from URL hash
        if (window.location.hash !== '') {
            const file = window.location.hash.substring(1);
            if (validRedirects.has(file)) {
                selectFile(file);
                updateLinkScroll();
                viewer.src = validRedirects.get(file);
                viewer.style.display = 'unset';
            }
        }

        if (selected === null) {
            panel.classList.add('open');
            viewer.srcdoc = getPlaceholderHTML();
            viewer.style.display = 'unset';
        }

        // Restore search
        filterInput.value = extractQuery();
        if (filterInput.value !== '') {
            panel.classList.add('searchFocused');
            updateFilter(files, tags);
        }

        // Events
        filterInput.onfocus = () => panel.classList.add('searchFocused');
        filterInput.onblur = () => {
            if (filterInput.value === '') panel.classList.remove('searchFocused');
        };

        clearSearchButton.onclick = () => {
            filterInput.value = '';
            updateFilter(files, tags);
            filterInput.focus();
        };

        filterInput.addEventListener('input', () => updateFilter(files, tags));

        expandButton.addEventListener('click', (e) => {
            e.preventDefault();
            panel.classList.toggle('open');
            updateLinkScroll();
        });

        panelScrim.onclick = (e) => {
            e.preventDefault();
            panel.classList.toggle('open');
        };

        previewsToggler.onclick = (e) => {
            e.preventDefault();
            content.classList.toggle('minimal');
        };
    }

    function createLink(file, category, tags) {
        const color = getCategoryColor(category);
        const displayName = getName(file);
        const initial = displayName.charAt(0).toUpperCase();
        const screenshotUrl = screenshots[file];

        const coverContent = screenshotUrl
            ? `<img src="${screenshotUrl}" alt="${displayName}" loading="lazy">`
            : `<span>${initial}</span>`;

        const coverStyle = screenshotUrl
            ? ''
            : ` style="background: linear-gradient(135deg, ${color}22, ${color}44)"`;

        const template = `
            <div class="card">
                <a href="${file}.html" target="viewer">
                    <div class="cover"${coverStyle}>
                        ${coverContent}
                    </div>
                    <div class="title">${displayName}</div>
                </a>
            </div>
        `;

        const link = createElementFromHTML(template);

        link.querySelector('a[target="viewer"]').addEventListener('click', function (event) {
            if (event.button !== 0 || event.ctrlKey || event.altKey || event.metaKey) return;
            selectFile(file);
        });

        return link;
    }

    function selectFile(file) {
        if (selected !== null && links[selected]) {
            links[selected].classList.remove('selected');
        }

        links[file].classList.add('selected');
        window.location.hash = file;
        viewer.focus();
        viewer.style.display = 'unset';
        panel.classList.remove('open');
        selected = file;
    }

    function escapeRegExp(string) {
        string = string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return '(?=.*' + string.split(' ').join(')(?=.*') + ')';
    }

    function updateFilter(files, tags) {
        let v = filterInput.value.trim();
        v = v.replace(/[\s_]+/gi, ' ');

        if (v !== '') {
            window.history.replaceState({}, '', '?q=' + v + window.location.hash);
        } else {
            window.history.replaceState({}, '', window.location.pathname + window.location.hash);
        }

        const exp = new RegExp(escapeRegExp(v), 'gi');

        for (const key in files) {
            const section = files[key];
            for (let i = 0; i < section.length; i++) {
                filterExample(section[i], exp, tags);
            }
        }

        layoutList(files);
    }

    function filterExample(file, exp, tags) {
        const link = links[file];
        // Match Three.js: search against the full file identifier with underscores replaced.
        // For WE3D, strip the top-level category dir to avoid noise (e.g. "system" matching all).
        const parts = file.split('/');
        let target = parts.slice(1).join('/').replace(/_+/g, ' ');
        if (file in tags) target += ' ' + tags[file].join(' ');
        const res = target.match(exp);

        if (res && res.length > 0) {
            link.classList.remove('hidden');
        } else {
            link.classList.add('hidden');
        }
    }

    function getName(file) {
        const parts = file.split('/');
        if (parts.length >= 3) {
            return parts.slice(-2).join(' / ');
        }
        return parts[parts.length - 1];
    }

    function layoutList(files) {
        let visibleCount = 0;

        for (const key in files) {
            let collapsed = true;
            const section = files[key];

            for (let i = 0; i < section.length; i++) {
                if (!links[section[i]].classList.contains('hidden')) {
                    collapsed = false;
                    visibleCount++;
                }
            }

            const element = document.querySelector('h2[data-category="' + key + '"]');
            if (element) {
                element.classList.toggle('hidden', collapsed);
            }
        }

        statsEl.textContent = filterInput.value
            ? visibleCount + ' / ' + totalCount + ' examples'
            : totalCount + ' examples';
    }

    function extractQuery() {
        const search = window.location.search;
        if (search.indexOf('?q=') !== -1) {
            return decodeURI(search.slice(3));
        }
        return '';
    }

    function createElementFromHTML(htmlString) {
        const div = document.createElement('div');
        div.innerHTML = htmlString.trim();
        return div.firstChild;
    }

    function updateLinkScroll() {
        if (selected !== null && links[selected]) {
            const link = links[selected];
            content.scrollTop = link.offsetTop - content.offsetTop - (content.clientHeight - link.offsetHeight) / 2;
        }
    }

    function getPlaceholderHTML() {
